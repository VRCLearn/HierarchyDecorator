name: Validate VPM Package

on:
  pull_request:
    paths:
      - ".github/scripts/build-vpm.ps1"
      - ".github/scripts/build-unitypackage.ps1"
      - ".github/scripts/validate-localization.ps1"
      - ".github/scripts/build-listing.ps1"
      - ".github/upstream-sync.json"
      - ".github/workflows/*.yml"
      - "HierarchyDecorator/**"
      - "CHANGELOG.md"
      - "LICENSE.md"
      - "README.md"
      - "VPM.md"
      - "package.json"
      - ".github/source.json"
  push:
    branches:
      - master
    paths:
      - ".github/scripts/build-vpm.ps1"
      - ".github/scripts/build-unitypackage.ps1"
      - ".github/scripts/validate-localization.ps1"
      - ".github/scripts/build-listing.ps1"
      - ".github/upstream-sync.json"
      - ".github/workflows/*.yml"
      - "HierarchyDecorator/**"
      - "CHANGELOG.md"
      - "LICENSE.md"
      - "README.md"
      - "VPM.md"
      - "package.json"
      - ".github/source.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and validate VPM archive
        shell: pwsh
        run: ./.github/scripts/build-vpm.ps1 -Revision "$env:GITHUB_SHA"

      - name: Build and validate UnityPackage
        shell: pwsh
        run: ./.github/scripts/build-unitypackage.ps1

      - name: Check out the official VPM website template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vrchat-community/template-package
          ref: 591e23fe5175b8279cc3998f65e81add604aabc9
          path: official-template

      - name: Validate localization coverage
        shell: pwsh
        run: ./.github/scripts/validate-localization.ps1

      - name: Build and validate VPM repository listing
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./.github/scripts/build-listing.ps1 -SitePath official-template/Website -OutputDirectory dist/listing

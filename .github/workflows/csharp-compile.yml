name: C# compile (no license)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csharp-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: C# compile Unity ${{ matrix.unity-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        unity-version: [2022.3.22f1, 6000.3.13f1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the bundled compiler and reference assemblies are used. No Editor,
      # Unity account, license file, or repository secrets enter this container.
      - name: Compile Windows, macOS, and Linux editor branches
        env:
          UNITY_VERSION: ${{ matrix.unity-version }}
        run: |
          docker run --rm \
            --volume "$PWD:/repo" --workdir /repo \
            --env UNITY_VERSION \
            --entrypoint bash \
            "unityci/editor:ubuntu-${UNITY_VERSION}-base-3" \
            /repo/.github/unity-ci/compile-csharp.sh

      - name: Upload compiler responses and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csharp-compile-${{ matrix.unity-version }}
          path: .unity-ci~/csharp/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

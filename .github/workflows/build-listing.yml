name: Build Repo Listing

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build-listing.yml"
      - ".github/source.json"
      - ".github/scripts/build-listing.ps1"
  release:
    types:
      - published
      - edited
      - deleted

env:
  LIST_PUBLISH_DIRECTORY: dist/vpm-site

jobs:
  request-release-refresh:
    name: Queue a default-branch Pages refresh
    if: github.event_name == 'release'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the listing workflow on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-listing.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH"

  build-listing:
    if: github.event_name != 'release'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Check out the official VPM website template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vrchat-community/template-package
          ref: 591e23fe5175b8279cc3998f65e81add604aabc9
          path: official-template

      - name: Check out the official VPM listing renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ci

      - name: Render the official VPM listing website
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp .github/source.json official-template/source.json
          template=official-template/Website/index.html
          if ! perl -0pi -e \
            '$count = s{>Add to VCC<}{>Add to VCC/ALCOMD<}g; END { exit($count == 2 ? 0 : 1) }' \
            "$template"; then
            echo "The official template no longer contains exactly two Add to VCC buttons." >&2
            exit 1
          fi
          if ! perl -0pi -e \
            '$count = s{grid-template-columns="1fr 100px 220px"}{grid-template-columns="1fr 100px 280px"}g; END { exit($count == 1 ? 0 : 1) }' \
            "$template"; then
            echo "The official template no longer contains the expected package grid columns." >&2
            exit 1
          fi
          script_template=official-template/Website/app.js
          if ! perl -0pi -e \
            '$count = s!\Q{{ if package.Description; package.Description; end; }}\E!{{ if package.Description; package.Description | string.escape; end; }}!g; END { exit($count == 1 ? 0 : 1) }' \
            "$script_template"; then
            echo "The official template no longer contains the expected package description expression." >&2
            exit 1
          fi
          dotnet run \
            --project ci/PackageBuilder/PackageBuilder.csproj \
            --framework net8.0 \
            -- BuildRepoListing \
            --root ci \
            --package-listing-source-folder "$GITHUB_WORKSPACE/official-template" \
            --list-publish-directory "$GITHUB_WORKSPACE/official-template/Website" \
            --current-package-name com.wooshii.hierarchydecorator \
            --current-listing-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.vpm-empty-index.json"
          node --input-type=module --check < "$script_template"

      - name: Build package repository listing
        id: listing
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./.github/scripts/build-listing.ps1 -SitePath official-template/Website

      - name: Ensure at least one package version exists
        if: steps.listing.outputs.package_count == '0'
        shell: bash
        run: |
          echo "No VPM package release was found." >&2
          exit 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.LIST_PUBLISH_DIRECTORY }}

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
